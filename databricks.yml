    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405615954925655.15.azuredatabricks.net
      profile: DEFAULT
    variables:
      catalog: db_workspace_formation
      schema: ${workspace.current_user.short_name}
  
  prod:
    mode: production
    workspace:
      host: https://adb-7405615954925655.15.azuredatabricks.net
      profile: prod-sp
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ce9ee4c5-8ff5-4059-9a5c-6e2f5a65bd41
    variables:
      catalog: db_workspace_formation
      schema: prod
    permissions:
      - user_name: fatoumatacisse2501@outlook.com
        level: CAN_MANAGE
      - service_principal_name: ce9ee4c5-8ff5-4059-9a5c-6e2f5a65bd41
        level: CAN_MANAGE
      - group_name: users
        level: CAN_MANAGE
  
  ci:

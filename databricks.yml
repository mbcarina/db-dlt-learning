bundle:
  name: dab_dlt_learning
  uuid: 5d18a455-7b02-48d2-b2de-502deeb9d796

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
